<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
 
    <h1 class="text-danger">
    Inscrição para Curso de Programação
    </h1>
   
    <br><br>
 
    <fieldset>
   
 
        <legend> Dados Pessoais</legend>
 
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required> <br><br>
 
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required> <br><br>
 
        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" placeholder="********" required> <br><br>
       
        <label for="data">Data de nascimento:</label>
        <input type="date" id="data" name="data"> <br><br>
 
        <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone" name="telefone" placeholder="(__) _____-____">
    </fieldset>
 
    <br>
    <fieldset>
        <legend>Curso</legend>
        <label for="curso">Escolha o curso:</label>
        <select id="curso" name="curso">
            <option value="html">HTML e CSS</option>
            <option value="python">Python</option>
            <option value="java">Java</option>
            <option value="banco">Banco de Dados</option>
        </select> <p>Modalidade:</p>
        <input type="radio" id="presencial" name="modalidade" value="presencial">
       
        <label for="presencial">Presencial</label>
        <input type="radio" id="online" name="modalidade" value="online">
       
        <label for="online">Online</label>
        <p>Turno:</p>
        <input type="radio" id="manha" name="turno" value="manha">
       
        <label for="manha">Manhã</label>
        <input type="radio" id="tarde" name="turno" value="tarde">
         
        <label for="tarde">Tarde</label>
        <input type="radio" id="noite" name="turno" value="noite">
         
        <label for="noite">Noite</label>
       
    </fieldset>
 
    <br>
    <fieldset>
            <legend>Tecnologias</legend>
            <input type="checkbox" id="html" name="tecnologias" value="html">
 
            <label for="html">HTML</label>
            <input type="checkbox" id="css" name="tecnologias" value="css">
 
            <label for="css">CSS</label>
            <input type="checkbox" id="python" name="tecnologias" value="python">
 
            <label for="python">Python</label>
            <input type="checkbox" id="csharp" name="tecnologias" value="csharp">
 
            <label for="csharp">C#</label>
 
    </fieldset>
    <br>
        <label for="mensagem">Por que deseja fazer o curso?</label>
    <br>
        <textarea
        id="mensagem"
        name="mensagem"
        rows="5"
        cols="40"
        placeholder="Digite sua resposta"
        ></textarea>
 
    <br>
 
    <input type="checkbox" id="termos" name="termos" value="aceito" required>
    <label for="termos">Aceito os termos de inscrição</label>
   
    <br>
 
    <button type="submit">
        Cadastrar
    </button>
 
    <button type="reset">
        Limpar
    </button>
 
</body>
</html>
